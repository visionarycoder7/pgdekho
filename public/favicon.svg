<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />

  <!-- Modern House / Stay Geometric Symbol -->
  <g filter="url(#glow)">
    <!-- Main Roof & Walls -->
    <path d="M256 108L396 220V384C396 395.046 387.046 404 376 404H136C124.954 404 116 395.046 116 384V220L256 108Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Doorway / Arch -->
    <path d="M212 404V276C212 264.954 220.954 256 232 256H280C291.046 256 300 264.954 300 276V404" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Modern Chimney / Loft -->
    <path d="M336 172V128H372V200" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Verification Sun / Accent Beacon (PG Dekho Amber/Coral Pulse) -->
  <circle cx="384" cy="128" r="28" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="6" />
</svg>